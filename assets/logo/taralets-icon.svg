<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Emerald to Electric Mint Accent Gradient -->
    <linearGradient id="mint-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan / Sky Accent Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Warm Amber / Gold Accent for Co-Worker Spark -->
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="symbol-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Badge -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" filter="url(#icon-shadow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Geometric Symbol Group -->
  <g filter="url(#symbol-glow)">
    
    <!-- Dynamic Forward Road Arc / Swoosh (Represents Highway & Commute Momentum) -->
    <path d="M120 376 C 140 270, 210 200, 350 170" 
          fill="none" 
          stroke="url(#cyan-glow)" 
          stroke-width="32" 
          stroke-linecap="round" 
          opacity="0.85"/>

    <!-- Central 'T' & Arrow Hybrid (Tara = Let's Go!) -->
    <!-- Top Bar of 'T' / Aerodynamic Wing -->
    <path d="M112 144 C 112 128, 128 116, 144 116 L 368 116 C 384 116, 400 128, 400 144 C 400 156, 388 168, 372 168 L 140 168 C 124 168, 112 156, 112 144 Z" 
          fill="url(#mint-glow)"/>

    <!-- Main Stem of 'T' Transforming into Forward Arrow / Highway Lane -->
    <path d="M256 168 L 256 360 L 320 296 C 328 288, 342 288, 350 296 C 358 304, 358 318, 350 326 L 270 406 C 262 414, 250 414, 242 406 L 162 326 C 154 318, 154 304, 162 296 C 170 288, 184 288, 192 296 L 256 360 Z" 
          fill="url(#mint-glow)"/>

    <!-- Driver Location Node (Deep Green/Cyan) -->
    <circle cx="160" cy="240" r="26" fill="url(#cyan-glow)"/>
    <circle cx="160" cy="240" r="14" fill="#ffffff"/>

    <!-- Booked Co-Passenger Node (Warm Amber/Gold) -->
    <circle cx="352" cy="240" r="26" fill="url(#gold-glow)"/>
    <circle cx="352" cy="240" r="14" fill="#ffffff"/>

    <!-- Shared Ride Bridge / Connection Line between Driver & Passenger -->
    <line x1="186" y1="240" x2="326" y2="240" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 18"/>

  </g>

  <!-- Sleek Corner Accent: Car & Motorcycle Symbol Silhouette hint -->
  <g transform="translate(256, 204) scale(0.7)" opacity="0.95">
    <!-- Center Hub Dot -->
    <circle cx="0" cy="0" r="16" fill="#ffffff" filter="url(#symbol-glow)"/>
  </g>
</svg>
