<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="qr-drv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="qr-drv-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="320" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Header Banner -->
  <path d="M0 24 C0 10.7, 10.7 0, 24 0 L296 0 C309.3 0, 320 10.7, 320 24 L320 56 L0 56 Z" fill="url(#qr-drv-bg)"/>
  <text x="160" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1.5">
    TARALETS DRIVER EDITION
  </text>
  <text x="160" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle">
    Scan to Install • Car &amp; Motorcycle Drivers
  </text>

  <!-- QR Code Matrix Pattern -->
  <g transform="translate(48, 72) scale(0.9)" fill="#0f172a">
    <!-- Corner Finder Patterns (Top-Left, Top-Right, Bottom-Left) -->
    <!-- TL -->
    <rect x="0" y="0" width="70" height="70" rx="8" fill="#064e3b"/>
    <rect x="10" y="10" width="50" height="50" rx="4" fill="#ffffff"/>
    <rect x="20" y="20" width="30" height="30" rx="4" fill="#047857"/>

    <!-- TR -->
    <rect x="180" y="0" width="70" height="70" rx="8" fill="#064e3b"/>
    <rect x="190" y="10" width="50" height="50" rx="4" fill="#ffffff"/>
    <rect x="200" y="20" width="30" height="30" rx="4" fill="#047857"/>

    <!-- BL -->
    <rect x="0" y="180" width="70" height="70" rx="8" fill="#064e3b"/>
    <rect x="10" y="190" width="50" height="50" rx="4" fill="#ffffff"/>
    <rect x="20" y="200" width="30" height="30" rx="4" fill="#047857"/>

    <!-- Data Blocks -->
    <rect x="85" y="10" width="15" height="15" rx="3"/>
    <rect x="110" y="10" width="15" height="25" rx="3"/>
    <rect x="140" y="10" width="25" height="15" rx="3"/>
    <rect x="85" y="35" width="20" height="15" rx="3"/>
    <rect x="125" y="35" width="15" height="20" rx="3"/>
    <rect x="150" y="35" width="15" height="15" rx="3"/>
    <rect x="85" y="60" width="35" height="15" rx="3"/>
    <rect x="135" y="60" width="15" height="15" rx="3"/>

    <rect x="10" y="85" width="15" height="25" rx="3"/>
    <rect x="35" y="85" width="25" height="15" rx="3"/>
    <rect x="70" y="85" width="15" height="15" rx="3"/>
    <rect x="95" y="85" width="20" height="20" rx="3"/>
    <rect x="135" y="85" width="15" height="25" rx="3"/>
    <rect x="160" y="85" width="25" height="15" rx="3"/>
    <rect x="195" y="85" width="15" height="30" rx="3"/>
    <rect x="220" y="85" width="20" height="15" rx="3"/>

    <rect x="10" y="120" width="25" height="15" rx="3"/>
    <rect x="45" y="115" width="15" height="20" rx="3"/>
    <rect x="70" y="110" width="20" height="15" rx="3"/>
    <rect x="170" y="110" width="15" height="25" rx="3"/>
    <rect x="220" y="110" width="20" height="25" rx="3"/>

    <rect x="10" y="145" width="15" height="20" rx="3"/>
    <rect x="35" y="145" width="20" height="15" rx="3"/>
    <rect x="65" y="140" width="15" height="25" rx="3"/>
    <rect x="90" y="145" width="25" height="15" rx="3"/>
    <rect x="140" y="145" width="20" height="15" rx="3"/>
    <rect x="175" y="145" width="20" height="20" rx="3"/>
    <rect x="210" y="145" width="30" height="15" rx="3"/>

    <rect x="85" y="180" width="20" height="20" rx="3"/>
    <rect x="115" y="180" width="35" height="15" rx="3"/>
    <rect x="160" y="180" width="20" height="20" rx="3"/>
    <rect x="190" y="180" width="25" height="15" rx="3"/>
    <rect x="225" y="180" width="15" height="25" rx="3"/>

    <rect x="85" y="210" width="15" height="25" rx="3"/>
    <rect x="110" y="205" width="20" height="15" rx="3"/>
    <rect x="140" y="210" width="30" height="25" rx="3"/>
    <rect x="180" y="210" width="15" height="15" rx="3"/>
    <rect x="205" y="210" width="35" height="25" rx="3"/>

    <!-- Center Logo Badge -->
    <rect x="95" y="95" width="60" height="60" rx="16" fill="#022c22" stroke="#ffffff" stroke-width="4"/>
    <text x="125" y="132" font-size="28" text-anchor="middle">🚗</text>
  </g>

  <!-- Bottom CTA Tag -->
  <rect x="24" y="280" width="272" height="28" rx="8" fill="#f0fdf4"/>
  <text x="160" y="298" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">
    Post Routes • Verify Co-Workers • Earn Gas Share
  </text>
</svg>
