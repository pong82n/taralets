  <text x="160" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="1.5">
    TARALETS PASSENGER APP
  </text>
  <text x="160" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#cbd5e1" text-anchor="middle">
